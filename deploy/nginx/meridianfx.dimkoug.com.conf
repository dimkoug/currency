# Host-nginx reverse proxy for MeridianFX (https://meridianfx.dimkoug.com/).
#
# The host nginx terminates TLS (Let's Encrypt) and proxies to the app's front-door
# container (frontend nginx), which is published on loopback only via
# FRONTEND_BIND=127.0.0.1:8087 in .env. That container routes /ws/ to the backend
# replicas and /api/ through Varnish, so this vhost stays a thin TLS proxy.
#
# Install on the server:
#   1. Obtain the cert (the nginx authenticator needs no vhost to exist yet):
#        sudo certbot certonly --nginx -d meridianfx.dimkoug.com \
#             -m <you@example.com> --agree-tos --no-eff-email
#   2. cp deploy/nginx/meridianfx.dimkoug.com.conf /etc/nginx/sites-available/
#      ln -s /etc/nginx/sites-available/meridianfx.dimkoug.com.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
# Renewal is handled by the host's existing certbot.timer.

# WebSocket upgrade switch (uniquely named to avoid clashing with other vhosts'
# maps in the shared host nginx).
map $http_upgrade $meridianfx_connection_upgrade {
    default upgrade;
    ''      close;
}

# Persistent connection pool to the MeridianFX frontend container.
upstream meridianfx_app {
    server 127.0.0.1:8087;   # must match FRONTEND_BIND in .env
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name meridianfx.dimkoug.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS: reverse-proxy to the frontend container ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meridianfx.dimkoug.com;

    ssl_certificate     /etc/letsencrypt/live/meridianfx.dimkoug.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meridianfx.dimkoug.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Live rates WebSocket — long-lived; pass the upgrade headers through.
    location /ws/ {
        proxy_pass http://meridianfx_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $meridianfx_connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA + REST API (the frontend container routes /api/ through Varnish).
    location / {
        proxy_pass http://meridianfx_app;
        proxy_http_version 1.1;            # required for upstream keepalive
        proxy_set_header Connection "";     # reuse pooled connections
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
