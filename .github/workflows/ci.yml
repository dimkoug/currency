name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: currency
          POSTGRES_USER: currency
          POSTGRES_PASSWORD: currency
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U currency"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret
      DEBUG: "false"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: currency
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
      REDIS_URL: redis://localhost:6379/0
      DB_DISABLE_SERVER_SIDE_CURSORS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test

  e2e:
    name: E2E (compose smoke + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create .env
        run: cp .env.sample .env

      - name: Build & start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for live rates to populate
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/rates/latest/ | grep -q '"USD"'; then
              echo "rates populated"; exit 0
            fi
            sleep 5
          done
          echo "::error::rates did not populate"; docker compose logs --tail=80; exit 1

      - name: Smoke test (REST + Varnish cache + WebSocket)
        run: node e2e/smoke.mjs
        env:
          BASE_URL: http://localhost:8080

      - name: Playwright browser test
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: http://localhost:8080
          CI: "true"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=120

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  deploy:
    name: Deploy (production)
    # CD: only from main, only once every test job is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://meridianfx.dimkoug.com/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ssh_key }}
          SSH_HOST: ${{ secrets.ssh_host }}
          # Pinned host key (public) so a spoofed server can't receive the deploy.
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ6ySOkvXRmMbQjY1cS4RWAaE73AFLDiW5xeqPeIiw1J
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$SSH_HOST $HOST_KEY" > ~/.ssh/known_hosts

      - name: Pull, rebuild and health-check
        env:
          TARGET: ${{ secrets.ssh_user }}@${{ secrets.ssh_host }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET" bash -s -- "$SHA" <<'SCRIPT'
          set -euo pipefail
          cd /home/dimitris/projects/currency
          git fetch -q origin main
          git merge -q --ff-only "$1"
          docker compose up -d --build --remove-orphans < /dev/null
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8087/api/rates/latest/ | grep -q '"USD"'; then
              echo "deployed $(git log --oneline -1)"; exit 0
            fi
            sleep 5
          done
          echo "::error::health check failed"; docker compose logs --tail=80 < /dev/null; exit 1
          SCRIPT
